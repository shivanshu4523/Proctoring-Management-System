<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discipline360 - ID Card Scanner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://unpkg.com/quagga/dist/quagga.min.js"></script>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to right, #258cec, #095ded);
            color: #333;
        }

        nav {
            background-color: #1c1c1c;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .navbar-brand {
            font-weight: bold;
            font-size: 1.8rem;
            color: #ffffff !important;
        }

        .navbar-nav .nav-link {
            color: #ffffff !important;
            font-size: 1rem;
            margin-right: 15px;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .navbar-nav .nav-link:hover {
            color: #f0ad4e !important;
        }

        .hero-section {
            text-align: center;
            padding: 60px 20px;
            background: linear-gradient(to right, #2575fc, #6a11cb);
            color: #fff;
            border-radius: 0 0 50px 50px;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
        }

        .hero-section h1 {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .main-container {
            max-width: 800px;
            margin: 30px auto;
            background: #ffffff;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }

        #video-container {
            position: relative;
            width: 100%;
            height: 400px;
        }

        #video {
            width: 100%;
            height: 100%;
            background-color: black;
            border-radius: 10px;
        }

        #video-thumbnail {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 2;
        }

        .btn-primary {
            width: 100%;
            margin-top: 10px;
            background: #2575fc;
            border: none;
            border-radius: 25px;
            font-weight: bold;
            transition: all 0.3s ease-in-out;
        }

        .btn:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }

        footer {
            text-align: center;
            margin-top: 30px;
            padding: 15px 0;
            background: #1c1c1c;
            color: #fff;
            font-weight: 500;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="#">Discipline360</a>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero-section">
        <h1>ID Card Scanner</h1>
        <p>Scan student ID cards to retrieve their details.</p>
    </section>

    <!-- Main Content -->
    <div class="main-container">
        <div class="section">
            <h4>Scan Barcode with Camera</h4>
            <div id="video-container">
                <video id="video" autoplay></video>
                <img id="video-thumbnail" src="./img/scan5.jpeg" alt="Thumbnail">
            </div>
            <button class="btn btn-primary" id="start-scan">Start Scanning</button>
            <div id="barcode-result" class="mt-3">Waiting for barcode...</div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2024 Discipline360 | All Rights Reserved</p>
    </footer>

    <script>
        document.getElementById("start-scan").addEventListener("click", function () {
            const video = document.querySelector("#video");
            const thumbnail = document.getElementById("video-thumbnail");
        
            if (!isCameraActive) {
                navigator.mediaDevices
                    .getUserMedia({ video: { facingMode: "environment" } })
                    .then((stream) => {
                        video.srcObject = stream;
                        isCameraActive = true;
        
                        // Hide the thumbnail when the camera is active
                        thumbnail.style.display = "none";
        
                        initializeQuagga();
                    })
                    .catch((error) => {
                        console.error("Error accessing camera:", error);
                        alert("Failed to access the camera. Please check browser permissions and try again.");
                    });
            } else {
                console.log("Camera is already active.");
            }
        });
        
        let isCameraActive = false;
        let lastDetectedCode = null; // Store the last detected barcode
        let consecutiveSameCodeCount = 0; // Track consecutive identical reads
        
        function initializeQuagga() {
            const video = document.querySelector("#video");
        
            Quagga.init(
                {
                    inputStream: {
                        name: "Live",
                        type: "LiveStream",
                        target: video,
                        constraints: {
                            width: 640,
                            height: 480,
                            facingMode: "environment",
                        },
                    },
                    decoder: {
                        readers: [
                            "code_128_reader",
                            "ean_reader",
                            "upc_reader",
                            "ean_8_reader",
                            "code_39_reader",
                            "code_93_reader",
                            "i2of5_reader",
                            "codabar_reader",
                        ],
                    },
                    locate: true, // Enable barcode localization
                    numOfWorkers: navigator.hardwareConcurrency || 4, // Use optimal threads
                    debug: false, // Disable debug for better performance
                },
                function (err) {
                    if (err) {
                        console.error("Error initializing Quagga: ", err);
                        return;
                    }
                    console.log("Quagga initialized successfully.");
                    Quagga.start();
                }
            );
        
            Quagga.onDetected(handleDetectedBarcode);
        }
        
        function handleDetectedBarcode(result) {
            if (result && result.codeResult) {
                const detectedCode = result.codeResult.code;
        
                // If the detected code is the same as the previous one, increase the count
                if (detectedCode === lastDetectedCode) {
                    consecutiveSameCodeCount++;
                } else {
                    consecutiveSameCodeCount = 1; // Reset the count if a new code is detected
                    lastDetectedCode = detectedCode; // Update the last detected code
                }
        
                // Confirm detection only if the code is read consistently multiple times
                if (consecutiveSameCodeCount >= 3) {
                    console.log("Barcode detected:", detectedCode);
                    document.getElementById("barcode-result").innerText = `Detected Barcode: ${detectedCode}`;
        
                    // Stop scanning after detection
                    Quagga.stop();
                    stopCameraStream();
                }
            }
        }
        
        function stopCameraStream() {
            const video = document.querySelector("#video");
            const stream = video.srcObject;
        
            if (stream) {
                const tracks = stream.getTracks();
                tracks.forEach((track) => track.stop());
            }
        
            isCameraActive = false;
            video.srcObject = null; // Clear video element
        }
        
        window.addEventListener("beforeunload", function () {
            Quagga.stop();
            stopCameraStream();
        });
        </script>
        
</body>

</html>
