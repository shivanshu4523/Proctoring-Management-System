            <!-- Main Content Area -->

            <div class="col-md-9" id="notificationForm">
                <div class="form-section">
                    <h3 class="form-heading">Notify HOD - Enter Student Details</h3>
                    <form id="notificationForm">
                        <div class="mb-3">
                            <label for="studentName" class="form-label">Student Name</label>
                            <input type="text" class="form-control" id="studentName" placeholder="Enter Student Name"
                                required>
                        </div>

                        <div class="mb-3">
                            <label for="studentRollNo" class="form-label">Roll Number</label>
                            <input type="text" class="form-control" id="rollNo" placeholder="Enter Roll Number"
                                maxlength="11">
                        </div>
                        <div class="mb-3">
                            <label for="placeOfMisbehavior" class="form-label">Branch</label>
                            <input type="text" class="form-control" id="placeOfMisbehavior"
                                placeholder="Branch of Student">
                        </div>

                        <div class="mb-3">
                            <label for="incidentDate" class="form-label">Date of Misbehavior Activity</label>
                            <input type="date" class="form-control" id="incidentDate">
                        </div>

                        <div class="mb-3">
                            <label for="misbehaviorDetails" class="form-label">Details of Misbehavior and Place</label>
                            <textarea class="form-control" id="misbehaviorDetails" rows="3"
                                placeholder="Enter the details"></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="place" class="form-label">Upload Evidence (Images/Videos)</label>
                            <input type="file" class="form-control" id="evidence" accept="image/*, video/*" multiple>
                        </div>

                        <br>
                        <button type="submit" class="btn btn-send">Send Notification to HOD</button>
                        <button type="submit" class="btn btn-send">Send to Parents</button>
                        <br>
                    </form>

            <script type="text/javascript"
                src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
            <script type="text/javascript">
                (function () {
                    emailjs.init("XPva953fR_Geno8za");
                })();
            </script>

            <script>
                document.addEventListener("DOMContentLoaded", function () {
                    const notificationForm = document.getElementById("notificationForm");

                    if (notificationForm) {
                        notificationForm.addEventListener("submit", function (event) {
                            event.preventDefault();

                            const studentName = document.getElementById("studentName").value;
                            const rollNo = document.getElementById("rollNo").value;
                            const placeOfMisbehavior = document.getElementById("placeOfMisbehavior").value;
                            const misbehaviorDetails = document.getElementById("misbehaviorDetails").value;
                            const incidentDate = document.getElementById("incidentDate").value;

                            const currentTime = new Date();
                            const formattedTime = currentTime.toLocaleTimeString();

                            console.log({ studentName, rollNo, placeOfMisbehavior, misbehaviorDetails, incidentDate, formattedTime });

                            emailjs
                                .send("service_7gt04xb", "template_1rfn2av", {
                                    student_name: studentName,
                                    roll_no: rollNo,
                                    place_of_misbehavior: placeOfMisbehavior,
                                    misbehavior_details: misbehaviorDetails,
                                    incident_date: incidentDate,
                                    incident_time: formattedTime,
                                    to_email: "shivanshusrivastava440@gmail.com",
                                    subject: `Misbehavior Alert for Student: ${studentName}`,
                                })
                                .then(function (response) {
                                    if (response.status === 200) {
                                        console.log("Notification SUCCESS!", response.status, response.text);
                                        alert("Notification sent successfully to the HOD! ✅");
                                        notificationForm.reset();
                                    } else {
                                        throw new Error("Notification was not successful!❌");
                                    }
                                })
                                .catch(function (error) {
                                    console.error("Notification FAILED...", error);
                                    notificationForm.reset();
                                });
                            notificationForm.reset();
                        });
                    } else {
                        console.error("Form not found in the DOM!");
                    }
                });

                document.getElementById('logout').addEventListener('click', function (event) {
                    event.preventDefault();
                    if (confirm('Are you sure you want to logout?')) {
                        sessionStorage.removeItem('token');
                        window.location.href = 'displine.html';
                    }
                });

            </script>


            <script>
                const barcode = localStorage.getItem("barcode");

                if (barcode) {
                    console.log("Student barcode: " + barcode);
                } else {
                    console.log("No barcode found");
                }



                window.onload = function () {
                    const barcode = localStorage.getItem("barcode");

                    if (barcode) {
                        document.getElementById('rollNo').value = barcode;
                    } else {
                        console.log("No barcode found");
                    }
                }





            </script>

<script>
    window.onload = function () {
        const studentName = localStorage.getItem("studentName");
        const barcode = localStorage.getItem("barcode");
        const studentBranch = localStorage.getItem("studentBranch");
        const studentPhoto = localStorage.getItem("studentPhoto"); // Retrieve student photo from localStorage

        if (studentName && barcode && studentBranch && studentPhoto) {
            // Populate student details in the form
            document.getElementById('studentName').value = studentName;
            document.getElementById('rollNo').value = barcode;
            document.getElementById('placeOfMisbehavior').value = studentBranch;

            // Set the student photo
            const studentPhotoElement = document.getElementById('studentPhoto');
            studentPhotoElement.src = studentPhoto; // Dynamically set the src of the image

            // Clear localStorage after using the data
            localStorage.removeItem("studentName");
            localStorage.removeItem("barcode");
            localStorage.removeItem("studentBranch");
            localStorage.removeItem("studentPhoto");
        } else {
            console.log("No student details found in localStorage.");
        }
    }
</script>
