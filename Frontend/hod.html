<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notify Parents - Misbehavior Report</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(45deg, #f06, #f79c42);
            height: 100vh;
            color: #fff;
        }

        header {
            text-align: center;
            padding: 40px;
            background: #2C3E50;
            box-shadow: 0px 10px 20px rgba(0, 0, 0, 0.1);
            border-radius: 15px;
            margin-top: 30px;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1rem;
            margin-top: 5px;
        }

        .form-container {
            background: white;
            max-width: 900px;
            margin: 50px auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 15px 40px rgba(0, 0, 0, 0.1);
        }

        .form-container h2 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 30px;
            color: #2C3E50;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            font-size: 1.1rem;
            color: #333;
            font-weight: 600;
            display: block;
            margin-bottom: 8px;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 15px;
            font-size: 1rem;
            border-radius: 8px;
            border: 1px solid #ccc;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: border 0.3s ease;
        }

        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            border: 1px solid #3498db;
            outline: none;
        }

        .form-group textarea {
            height: 150px;
            resize: vertical;
        }

        .button {
            width: 100%;
            padding: 15px;
            font-size: 1.2rem;
            color: #fff;
            background-color: #2C3E50;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .button:hover {
            background-color: #3498db;
        }

        .button:disabled {
            background-color: #BDC3C7;
            cursor: not-allowed;
        }

        .success-message {
            text-align: center;
            margin-top: 20px;
            padding: 15px;
            background-color: #2ecc71;
            color: white;
            border-radius: 8px;
            display: none;
        }

        .error-message {
            text-align: center;
            margin-top: 20px;
            padding: 15px;
            background-color: #e74c3c;
            color: white;
            border-radius: 8px;
            display: none;
        }

        .form-container .input-group {
            display: flex;
            justify-content: space-between;
            gap: 20px;
        }

        .form-container .input-group input {
            flex: 1;
        }

    </style>
</head>
<body>
    <section id="Notificaiton">
    <header>
        <h1>Misbehavior Report Form</h1>
        <p>Notify parents about student's misbehavior and other important details</p>
    </header>

    <div class="form-container">
        <h2>Student Misbehavior Report</h2>
        <form id="notifyForm">
            <!-- Student Name -->
            <div class="form-group">
                <label for="studentName">Student Name</label>
                <input type="text" id="studentName" name="studentName" required placeholder="Enter student name">
            </div>

            <!-- Misbehavior Activity -->
            <div class="form-group">
                <label for="misbehaviorActivity">Misbehavior Activity</label>
                <textarea id="misbehaviorActivity" name="misbehaviorActivity" required placeholder="Describe the misbehavior activity"></textarea>
            </div>

            <!-- Times of Misbehavior -->
            <div class="form-group">
                <label for="misbehaviorTimes">Times of Misbehavior</label>
                <input type="number" id="misbehaviorTimes" name="misbehaviorTimes" required min="1" placeholder="How many times this has occurred">
            </div>

            <!-- HOD's Notes -->
            <div class="form-group">
                <label for="hodNotes">HOD's Note to Parents</label>
                <textarea id="hodNotes" name="hodNotes" required placeholder="Write a note to the parents"></textarea>
            </div>

            <!-- Select Date -->
            <div class="form-group input-group">
                <div>
                    <label for="incidentDate">Date of Incident</label>
                    <input type="date" id="incidentDate" name="incidentDate" required>
                </div>
            </div>

            <button type="submit" class="button">Notify Parents</button>
        </form>

        <div class="success-message" id="successMessage">
            <p>Message sent successfully to the parents!</p>
        </div>

        <div class="error-message" id="errorMessage">
            <p>There was an error sending the message. Please try again.</p>
        </div>
    </div>
</section>
    <script>
        const form = document.getElementById('notifyForm');
        const successMessage = document.getElementById('successMessage');
        const errorMessage = document.getElementById('errorMessage');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            // You can add actual form submission logic here, e.g., AJAX or sending to a server

            const studentName = document.getElementById('studentName').value;
            const misbehaviorActivity = document.getElementById('misbehaviorActivity').value;
            const misbehaviorTimes = document.getElementById('misbehaviorTimes').value;
            const hodNotes = document.getElementById('hodNotes').value;
            const incidentDate = document.getElementById('incidentDate').value;

            if (studentName && misbehaviorActivity && misbehaviorTimes && hodNotes && incidentDate) {
                successMessage.style.display = 'block';
                errorMessage.style.display = 'none';
            } else {
                errorMessage.style.display = 'block';
                successMessage.style.display = 'none';
            }
        });
    </script>
</body>
</html>
